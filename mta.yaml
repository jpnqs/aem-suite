_schema-version: 3.3.0
ID: aem-suite
version: 1.0.0
description: "Test suite for SAP Advanced Event Mesh brokers"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node scripts/build-docs.js
modules:
  - name: aem-suite-srv
    type: nodejs
    path: gen/srv
    parameters:
      # live subscriptions are held in memory -> keep a single instance (see README)
      instances: 1
      memory: 512M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: aem-suite-auth
      - name: aem-suite-db
      - name: aem-suite-destination

  - name: aem-suite-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: aem-suite-db

  # Standalone approuter: sandbox launchpad, MCP (/mcp, /.well-known) - UI content comes from the HTML5 repo
  - name: aem-suite
    type: approuter.nodejs
    path: app/router
    build-parameters:
      builder: npm
      ignore:
        - default-env.json
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 120000
      - name: aem-suite-auth
      - name: aem-suite-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  # Uploads the UI apps (zips built by the html5 modules below) to the HTML5 Application Repository
  - name: aem-suite-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: aem-suite-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: aem-suite-launchpad
          artifacts:
            - comaemsuitelaunchpad.zip
          target-path: resources/
        - name: aem-suite-testcases
          artifacts:
            - comaemsuitetestcases.zip
          target-path: resources/
        - name: aem-suite-runs
          artifacts:
            - comaemsuiteruns.zip
          target-path: resources/
        - name: aem-suite-subscriber
          artifacts:
            - comaemsuitesubscriber.zip
          target-path: resources/
        - name: aem-suite-messages
          artifacts:
            - comaemsuitemessages.zip
          target-path: resources/
        - name: aem-suite-brokers
          artifacts:
            - comaemsuitebrokers.zip
          target-path: resources/
        - name: aem-suite-variables
          artifacts:
            - comaemsuitevariables.zip
          target-path: resources/
        - name: aem-suite-help
          artifacts:
            - comaemsuitehelp.zip
          target-path: resources/
        - name: aem-suite-home
          artifacts:
            - comaemsuitehome.zip
          target-path: resources/

  # Instance-level destinations for the managed approuter (SAP Build Work Zone), sap.cloud.service "aemsuite"
  # (= "sap.cloud" in the manifests). Also creates the XSUAA service key used by AI clients (MCP).
  - name: aem-suite-destination-content
    type: com.sap.application.content
    requires:
      - name: aem-suite-auth
        parameters:
          service-key:
            name: aem-suite-auth-key
      - name: aem-suite-html5-repo-host
        parameters:
          service-key:
            name: aem-suite-html5-repo-host-key
      - name: srv-api
      - name: aem-suite-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: aem-suite-html5-repository
              ServiceInstanceName: aem-suite-html5-repo-host
              ServiceKeyName: aem-suite-html5-repo-host-key
              sap.cloud.service: aemsuite
            - Name: aem-suite-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: aem-suite-auth
              ServiceKeyName: aem-suite-auth-key
              sap.cloud.service: aemsuite
            # used by the apps' xs-app.json (same name as the standalone approuter's destination)
            # (forwarding the token with Authentication: NoAuthentication + HTML5.ForwardAuthToken is refused by this
            # module: it demands a ServiceInstanceName; the token exchange passes the user on to the backend as well)
            - Name: srv-api
              URL: ~{srv-api/srv-url}
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: aem-suite-auth
              ServiceKeyName: aem-suite-auth-key
              Type: HTTP
              ProxyType: Internet
              HTML5.Timeout: 120000

  - name: aem-suite-launchpad
    type: html5
    path: app/launchpad
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []
  - name: aem-suite-testcases
    type: html5
    path: app/testcases
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []
  - name: aem-suite-runs
    type: html5
    path: app/runs
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []
  - name: aem-suite-subscriber
    type: html5
    path: app/subscriber
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []
  - name: aem-suite-messages
    type: html5
    path: app/messages
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []
  - name: aem-suite-brokers
    type: html5
    path: app/brokers
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []
  - name: aem-suite-variables
    type: html5
    path: app/variables
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []
  - name: aem-suite-help
    type: html5
    path: app/help
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []
  - name: aem-suite-home
    type: html5
    path: app/home
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []

resources:
  - name: aem-suite-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: aem-suite-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.${default-domain}/**
            # OAuth callback of local AI clients (e.g. claude mcp add ... --callback-port 8765)
            - http://localhost:8765/**
  - name: aem-suite-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: aem-suite-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        # lets the managed approuter (Work Zone) use the instance-level destinations above
        HTML5Runtime_enabled: true
  - name: aem-suite-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: aem-suite-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
