services:
  solace:
    # a fixed version, so every developer runs the same broker (10.26.0 = "lts" / "latest" as of 2026-10)
    image: solace/solace-pubsub-standard:10.26.0
    container_name: solace-broker
    hostname: solace
    ports:
      - "8080:8080" # Solace PubSub+ Manager / Web UI / SEMP API
      - "55555:55555" # Native Solace messaging protocol (SMF)
      - "1883:1883" # MQTT
      - "5672:5672" # AMQP
      - "8008:8008" # Web Transport (SMF over WebSocket)
      - "9000:9000" # REST messaging
    shm_size: '1gb' # Required shared memory size for Solace data plane
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - username_admin_globalaccesslevel=admin
      # local only; set SOLACE_ADMIN_PASSWORD (and SOLACE_SEMP_PASSWORD for terragrunt/tg.ps1) to use another one
      - username_admin_password=${SOLACE_ADMIN_PASSWORD:-admin}
