<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEM Test Suite</title>
  <script>
    window["sap-ushell-config"] = {
      defaultRenderer: "fiori2",
      renderers: { fiori2: { componentData: { config: { enableSearch: false, rootIntent: "Shell-home" } } } },
      applications: {
        "AEMSuiteHome-display": {
          title: "AEM Suite – Home",
          description: "Everyone · All apps and the state of the suite",
          icon: "sap-icon://home",
          additionalInformation: "SAPUI5.Component=com.aem.suite.home",
          applicationType: "URL",
          url: "../comaemsuitehome/"
        },
        "AEMSuiteTestCases-manage": {
          title: "AEM Suite – Test Cases",
          description: "Tester · Maintain and run test cases",
          icon: "sap-icon://lab",
          additionalInformation: "SAPUI5.Component=com.aem.suite.testcases",
          applicationType: "URL",
          url: "../comaemsuitetestcases/"
        },
        "AEMSuiteTestRuns-display": {
          title: "AEM Suite – Test Runs",
          description: "Tester · Results per broker",
          icon: "sap-icon://kpi-managing-my-area",
          additionalInformation: "SAPUI5.Component=com.aem.suite.runs",
          applicationType: "URL",
          url: "../comaemsuiteruns/"
        },
        "AEMSuiteSubscriber-display": {
          title: "AEM Suite – Live Subscriber",
          description: "Tester · Watch topics and queues live",
          icon: "sap-icon://feeder-arrow",
          additionalInformation: "SAPUI5.Component=com.aem.suite.subscriber",
          applicationType: "URL",
          url: "../comaemsuitesubscriber/"
        },
        "AEMSuiteSavedMessages-display": {
          title: "AEM Suite – Saved Messages",
          description: "Tester · Messages kept from subscriptions",
          icon: "sap-icon://inbox",
          additionalInformation: "SAPUI5.Component=com.aem.suite.messages",
          applicationType: "URL",
          url: "../comaemsuitemessages/"
        },
        "AEMSuiteBrokers-manage": {
          title: "AEM Suite – Brokers",
          description: "Admin · Manage broker connections",
          icon: "sap-icon://connected",
          additionalInformation: "SAPUI5.Component=com.aem.suite.brokers",
          applicationType: "URL",
          url: "../comaemsuitebrokers/"
        },
        "AEMSuiteVariables-manage": {
          title: "AEM Suite – Global Variables",
          description: "Admin · Template variables for all brokers",
          icon: "sap-icon://key-user-settings",
          additionalInformation: "SAPUI5.Component=com.aem.suite.variables",
          applicationType: "URL",
          url: "../comaemsuitevariables/"
        },
        "AEMSuiteNumberRanges-manage": {
          title: "AEM Suite – Number Ranges",
          description: "Admin · Document numbers for your messages",
          icon: "sap-icon://numbered-text",
          additionalInformation: "SAPUI5.Component=com.aem.suite.numberranges",
          applicationType: "URL",
          url: "../comaemsuitenumberranges/"
        },
        "AEMSuiteCleanup-manage": {
          title: "AEM Suite – Data Cleanup",
          description: "Admin · Delete old runs, messages and setups",
          icon: "sap-icon://eraser",
          additionalInformation: "SAPUI5.Component=com.aem.suite.cleanup",
          applicationType: "URL",
          url: "../comaemsuitecleanup/"
        },
        "AEMSuiteAuditLog-display": {
          title: "AEM Suite – Audit Log",
          description: "Admin · Who changed or did what",
          icon: "sap-icon://history",
          additionalInformation: "SAPUI5.Component=com.aem.suite.auditlog",
          applicationType: "URL",
          url: "../comaemsuiteauditlog/"
        },
        "AEMSuiteHelp-display": {
          title: "AEM Suite – Help",
          description: "Everyone · How to use the suite",
          icon: "sap-icon://sys-help",
          additionalInformation: "SAPUI5.Component=com.aem.suite.help",
          applicationType: "URL",
          url: "../comaemsuitehelp/"
        }
      }
    };
  </script>
  <script id="sap-ushell-bootstrap" src="https://ui5.sap.com/1.148.12/test-resources/sap/ushell/bootstrap/sandbox.js"></script>
  <script id="sap-ui-bootstrap" src="https://ui5.sap.com/1.148.12/resources/sap-ui-core.js"
    data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
    data-sap-ui-compat-version="edge"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-frame-options="trusted"
    data-sap-ui-binding-syntax="complex"
    data-sap-ui-async="true"></script>
  <script>
    sap.ui.require(["sap/ui/core/Core"], function (Core) {
      Core.ready(function () {
        // behind the approuter: "Sign Out" ends the XSUAA session (the sandbox only reloads the page)
        if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          sap.ushell.Container.attachLogoutEvent(function () {
            location.href = location.origin + "/do/logout";
          });
        }
        sap.ushell.Container.createRenderer(true).then(function (renderer) {
          renderer.placeAt("content");
          hideTilesWithoutRole();
        });
      });
    });

    /**
     * Only the tiles of apps the user may open (app/_shared/Apps.js: role of an app): a tester does not see the admin
     * apps, whose service would answer 403. The navigation targets stay (a link still gets the app's own error).
     * Roles come from the Home app's overview(); if they cannot be read every tile stays.
     */
    var ROLE_OF = {
      "AEMSuiteTestCases-manage": "tester",
      "AEMSuiteTestRuns-display": "tester",
      "AEMSuiteSubscriber-display": "tester",
      "AEMSuiteSavedMessages-display": "tester",
      "AEMSuiteBrokers-manage": "admin",
      "AEMSuiteVariables-manage": "admin",
      "AEMSuiteNumberRanges-manage": "admin",
      "AEMSuiteCleanup-manage": "admin",
      "AEMSuiteAuditLog-display": "admin"
    };
    var TITLE_OF = {};
    Object.keys(window["sap-ushell-config"].applications).forEach(function (intent) {
      TITLE_OF[intent] = { title: window["sap-ushell-config"].applications[intent].title };
    });
    function hideTilesWithoutRole() {
      fetch("../comaemsuitehome/odata/v4/home/overview()", { credentials: "same-origin", headers: { Accept: "application/json" } })
        .then(function (response) {
          return response.ok ? response.json() : null;
        })
        .then(function (overview) {
          if (!overview) {
            return;
          }
          // the shell moves the applications of the config into its services
          var apps = TITLE_OF;
          var hidden = Object.keys(ROLE_OF)
            .filter(function (intent) {
              return !overview[ROLE_OF[intent]];
            })
            .map(function (intent) {
              return apps[intent].title;
            });
          if (!hidden.length) {
            return;
          }
          var hide = function () {
            document.querySelectorAll(".sapMGT").forEach(function (tile) {
              var title = tile.textContent || "";
              if (hidden.some(function (h) { return title.indexOf(h) >= 0; })) {
                (tile.closest(".sapUshellTile") || tile).style.display = "none";
              }
            });
          };
          hide();
          // tiles are rendered (and re-rendered) after this
          new MutationObserver(hide).observe(document.body, { childList: true, subtree: true });
        })
        .catch(function (e) {
          // every tile stays
          console.warn("[aem-suite] tiles by role not applied", e);
        });
    }
  </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
