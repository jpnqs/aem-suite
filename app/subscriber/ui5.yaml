specVersion: "4.0"
metadata:
  name: com.aem.suite.subscriber
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /comaemsuitesubscriber
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        omitTSFromBuildResult: true
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: comaemsuitesubscriber
        relativePaths: true
        additionalFiles:
          - xs-app.json
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
