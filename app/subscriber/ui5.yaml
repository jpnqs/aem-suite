specVersion: "4.0"
metadata:
  name: aem.suite.subscriber
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /subscriber
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        omitTSFromBuildResult: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
