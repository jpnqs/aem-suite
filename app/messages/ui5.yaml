specVersion: "4.0"
metadata:
  name: com.aem.suite.messages
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /comaemsuitemessages
builder:
  customTasks:
    - name: aem-shared-ui-task
      beforeTask: generateComponentPreload
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: comaemsuitemessages
        relativePaths: true
        additionalFiles:
          - xs-app.json
server:
  customMiddleware:
    - name: aem-shared-ui-middleware
      afterMiddleware: compression
---
# app/_shared modules of this app: added by the build, served by the dev server (scripts/ui5/shared-ui.js)
specVersion: "4.0"
kind: extension
type: task
metadata:
  name: aem-shared-ui-task
task:
  path: ../../scripts/ui5/shared-ui-task.js
---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: aem-shared-ui-middleware
middleware:
  path: ../../scripts/ui5/shared-ui-middleware.js
