specVersion: "4.0"
metadata:
  name: com.aem.suite.variables
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /comaemsuitevariables
builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: comaemsuitevariables
        relativePaths: true
        additionalFiles:
          - xs-app.json
